<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./assets/css/style.css">
    <script src="./assets/js/script.js" async></script>
    <title>affichage date et heure</title>
</head>
<body>
    <main>
        <fieldset id="dateday">
            <legend>date et heure du jour</legend>
            <div class="wrap">
                <label class="fixe" for="txtDate">date du jour</label>
                <input type="date" name="txtDate" id="txtDate">
                <button id="btnDate">afficher Date</button>
            </div>
            <div class="wrap">
                <label class="fixe" for="clock">heure locale</label>
                <input type="time" name="txtHeure" id="txtHeure">
                <button id="btnHeure">afficher l'heure</button>
            </div>
        </fieldset>
    </main>
</body>
</html>
