<!DOCTYPE html>
<html lang="fr-FR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulaire</title>
    <script src=""></script>
    <link rel="stylesheet" href="./assets/css/style.css">
    <script src="./assets/js/script.js" defer></script>
</head>
<body>
    <h1>Expressions régulières</h1>
    <h2>Contrôles de saisie</h2>
    <fieldset><legend>formulaire d'inscription</legend>
  <form action="" method="GET" enctype="application/x-www-form-urlencoded">
        <div>
            <label for="myName">Nom</label>
            <input id="myName" name="myName" type="text" placeholder="votre nom" required>
        </div>
        <div>
            <label for="myBirthDate">Date de naissance</label>
            <input id="myBirthDate" type="date" value="1971-07-21"  name="myBirthDate" required>
        </div>
        <div>
            <label for="myPhone">Téléphone</label>
            <select  name="indicatif">
                <option value="1">+1</option>
                <option value="32">+32</option>
                <option value="33">+33</option>
                <option value="41">+41</option>
            </select>
            <input id="myPhone" name="myPhone" required type="tel" placeholder="ex: 0102030405" value="06.02.03 04 &Tab;05">
        </div>
        <div>
            <label for="myPassword1">Mot de passe</label>
            <input id="myPassword1" name="myPassword1" type="password" required>
        </div>
        <div>
            <label for="myPassword2">Répétez Mot de passe</label>
            <input id="myPassword2" name="myPassword2" type="password" required>
        </div>
        <div>
            <button type="submit" id="valider">Valider</button>
        </div>
    </form>
    </fieldset>
    <hr>
    <aside id="result">

    </aside>
</body>
</html>
