<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./assets/css/style.css">
    <script src="./assets/js/main.js" defer></script>
    <title>Tableau d'objets</title> 
</head>
<body>
    <header>
        <h1 class="titre">Espace membres</h1>    
    </header>
    <form class="form" action="">
        <fieldset class="form__Connex">
            <legend>Identification</legend>
            <label for="identifiant">Identifiant :
                <input type="text" id="identifiant" name="id" required>
            </label>
            <label for="mdp">Mot de passe :
                <input type="password" id="mdp" name="mdp" required>
            </label>
            <button type="submit" id="connect">Connexion</button>
        </fieldset>
    </form>
</body>
